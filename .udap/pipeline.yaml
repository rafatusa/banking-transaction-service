version: 1
name: banking-transaction-service
vcs: github

rollback:
  strategy: manual

stages:
  # ---------------- Build ----------------
  - id: build
    kind: build
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven build (compile + package, tests deferred)
        run: mvn -B -ntp clean package -DskipTests
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # ---------------- Static analysis / formatting ----------------
  - id: format
    kind: lint
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spotless formatting check
        run: mvn -B -ntp spotless:check

  - id: checkstyle
    kind: lint
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Checkstyle (report always produced, verdict recorded)
        run: bash scripts/ci/run_gate.sh checkstyle mvn -B -ntp checkstyle:check
      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          retention-days: 30
      - name: Fail if Checkstyle violations exist
        run: bash scripts/ci/assert_gate.sh checkstyle

  - id: pmd
    kind: lint
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: PMD + CPD (report always produced, verdict recorded)
        run: bash scripts/ci/run_gate.sh pmd mvn -B -ntp pmd:check pmd:cpd-check
      - name: Upload PMD report
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: |
            target/pmd.xml
            target/cpd.xml
          retention-days: 30
      - name: Fail if PMD violations exceed threshold
        run: bash scripts/ci/assert_gate.sh pmd

  - id: spotbugs
    kind: lint
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: SpotBugs (report always produced, verdict recorded)
        run: bash scripts/ci/run_gate.sh spotbugs mvn -B -ntp spotbugs:check
      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 30
      - name: Fail if SpotBugs High priority issues exist
        run: bash scripts/ci/assert_gate.sh spotbugs

  # ---------------- Tests + coverage ----------------
  #
  # Unit and integration tests run in SEPARATE jobs, each producing its own
  # JaCoCo execution file. Neither job enforces the coverage gate: the `coverage`
  # stage below collects both exec files, merges them and gates on the total.
  # Gating on unit data alone would understate real coverage by roughly half —
  # the controllers and the exception handler are exercised by the REST Assured
  # suite against a real Postgres.
  - id: unit_tests
    kind: test
    needs: [build]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: JUnit 5 + Mockito unit tests with JaCoCo
        run: bash scripts/ci/run_gate.sh unit-tests mvn -B -ntp test
      - name: Upload Surefire test report
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/surefire-reports
          retention-days: 30
      - name: Upload unit coverage execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-unit
          path: target/jacoco-ut.exec
          retention-days: 7
      - name: Fail if unit tests failed
        run: bash scripts/ci/assert_gate.sh unit-tests

  - id: integration_tests
    kind: test
    needs: [build]
    timeout_minutes: 30
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spring Boot integration + REST Assured API tests (Testcontainers Postgres)
        run: bash scripts/ci/run_gate.sh integration-tests mvn -B -ntp verify -Pintegration-tests -Djacoco.skip=false
      - name: Upload REST Assured / Failsafe report
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-report
          path: target/failsafe-reports
          retention-days: 30
      - name: Upload integration coverage execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-integration
          path: target/jacoco-it.exec
          retention-days: 7
      - name: Fail if integration or API tests failed
        run: bash scripts/ci/assert_gate.sh integration-tests

  - id: coverage
    kind: test
    needs: [unit_tests, integration_tests]
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Recompile classes for the coverage report
        run: mvn -B -ntp test-compile -DskipTests
      - name: Download unit coverage execution data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec-unit
          path: target
      - name: Download integration coverage execution data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec-integration
          path: target
      - name: Merge unit + integration coverage
        run: mvn -B -ntp jacoco:merge@merge-coverage
      - name: Generate merged JaCoCo report
        run: mvn -B -ntp jacoco:report@merged-report
      - name: Upload merged JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 30
      - name: Enforce coverage gates (line >= 90%, branch >= 85%)
        run: mvn -B -ntp jacoco:check@coverage-gate

  - id: mutation_tests
    kind: test
    needs: [unit_tests]
    timeout_minutes: 40
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: PIT mutation testing (mutation score gate >= 70%)
        run: bash scripts/ci/run_gate.sh pit mvn -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT mutation report
        uses: actions/upload-artifact@v4
        with:
          name: pit-mutation-report
          path: target/pit-reports
          retention-days: 30
      - name: Fail if mutation score below threshold
        run: bash scripts/ci/assert_gate.sh pit

  # ---------------- Security ----------------
  #
  # Dependency CVE scanning uses TRIVY against the BUILT SPRING BOOT JAR, not the
  # source tree. This target is deliberate: `trivy fs` over the repository sees
  # only pom.xml, from which Trivy cannot resolve the transitive dependency
  # graph — it would report almost nothing and look green. The fat JAR contains
  # every resolved dependency under BOOT-INF/lib/ as a concrete versioned
  # artifact, which is the equivalent of what OWASP Dependency-Check analysed.
  #
  # Replaces the former `dependency_check` stage, which could not populate the
  # rate-limited NVD database from a shared GitHub runner IP without an NVD API
  # key. See docs/adr/0004-trivy-replaces-owasp-dependency-check.md.
  #
  # --ignore-unfixed is intentionally NOT set here (unlike the OS-level fs and
  # image scans): an unfixed CVE in the application's own dependency set is a
  # real finding, not unavoidable base-image noise.
  - id: dependency_scan
    kind: security
    needs: [build]
    timeout_minutes: 20
    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.58.1
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
      - name: Trivy dependency scan of the application JAR (CRITICAL/HIGH fail the gate)
        run: bash scripts/ci/run_gate.sh dependency-scan trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --format sarif --output dependency-scan-report.sarif target
      - name: Human-readable dependency findings table
        run: bash scripts/ci/run_gate.sh dependency-scan-table trivy fs --scanners vuln --severity CRITICAL,HIGH --format table --output dependency-scan-report.txt target
      - name: Upload dependency scan report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: |
            dependency-scan-report.sarif
            dependency-scan-report.txt
          retention-days: 30
      - name: Fail on High or Critical vulnerable dependencies
        run: bash scripts/ci/assert_gate.sh dependency-scan

  - id: sbom
    kind: security
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate CycloneDX SBOM
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/bom.json
          retention-days: 90

  - id: gitleaks
    kind: security
    timeout_minutes: 10
    steps:
      - name: Install gitleaks
        run: |
          GL_VERSION=8.24.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks secret scan
        run: bash scripts/ci/run_gate.sh gitleaks gitleaks detect --source . --redact --report-format sarif --report-path gitleaks-report.sarif --exit-code 1
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30
      - name: Fail if any secret was detected
        run: bash scripts/ci/assert_gate.sh gitleaks

  - id: semgrep
    kind: security
    timeout_minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install --no-cache-dir semgrep
      - name: Semgrep SAST (ERROR severity fails the gate)
        run: bash scripts/ci/run_gate.sh semgrep semgrep scan --config p/java --config p/owasp-top-ten --config p/secrets --error --sarif --output semgrep-report.sarif .
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.sarif
          retention-days: 30
      - name: Fail on Semgrep findings
        run: bash scripts/ci/assert_gate.sh semgrep

  - id: trivy_fs
    kind: security
    timeout_minutes: 20
    steps:
      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.58.1
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
      - name: Trivy filesystem scan (CRITICAL/HIGH fail the gate)
        run: bash scripts/ci/run_gate.sh trivy-fs trivy fs --scanners vuln,secret,misconfig --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format sarif --output trivy-fs-report.sarif .
      - name: Upload Trivy FS report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.sarif
          retention-days: 30
      - name: Fail on Critical or High filesystem findings
        run: bash scripts/ci/assert_gate.sh trivy-fs

  # ---------------- Container ----------------
  - id: docker_build
    kind: build
    needs: [format, checkstyle, pmd, spotbugs, coverage, mutation_tests, dependency_scan, sbom, gitleaks, semgrep, trivy_fs]
    timeout_minutes: 25
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t banking-transaction-service:${{ github.sha }} .
      - name: Save image for scan stage
        run: docker save banking-transaction-service:${{ github.sha }} -o /tmp/image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  - id: trivy_image
    kind: security
    needs: [docker_build]
    timeout_minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/image.tar
      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.58.1
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
      - name: Trivy container scan (CRITICAL/HIGH fail the gate)
        run: bash scripts/ci/run_gate.sh trivy-image trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format sarif --output trivy-image-report.sarif banking-transaction-service:${{ github.sha }}
      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.sarif
          retention-days: 30
      - name: Fail on Critical or High container findings
        run: bash scripts/ci/assert_gate.sh trivy-image

  - id: publish_image
    kind: build_push
    needs: [trivy_image]
    timeout_minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/image.tar
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Tag and push to GHCR
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag banking-transaction-service:${{ github.sha }} ghcr.io/${REPO_LC}:${{ github.sha }}
          docker tag banking-transaction-service:${{ github.sha }} ghcr.io/${REPO_LC}:latest
          docker push ghcr.io/${REPO_LC}:${{ github.sha }}
          docker push ghcr.io/${REPO_LC}:latest

  # ---------------- Infrastructure ----------------
  - id: tf_validate
    kind: lint
    timeout_minutes: 10
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Terraform init (no backend, validation only)
        run: terraform init -input=false -backend=false
        working-directory: infra
      - name: Terraform validate
        run: terraform validate
        working-directory: infra

  - id: provision
    kind: provision
    needs: [publish_image, tf_validate]
    timeout_minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
        working-directory: infra
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: infra

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init (read state for outputs)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read infrastructure outputs
        id: tfout
        run: |
          echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
          echo "db_host=$(terraform output -raw db_address)" >> "$GITHUB_OUTPUT"
          echo "app_log_group=$(terraform output -raw app_log_group)" >> "$GITHUB_OUTPUT"
          echo "system_log_group=$(terraform output -raw system_log_group)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ steps.tfout.outputs.host }}" >> ~/.ssh/known_hosts
      - name: Wait for SSH availability
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 \
              "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}" true 2>/dev/null; then
              echo "SSH ready"; exit 0
            fi
            echo "waiting for sshd ($i/30)"; sleep 10
          done
          echo "SSH never became available"; exit 1
      - name: Render Hiera data from infrastructure outputs
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DB_HOST: ${{ steps.tfout.outputs.db_host }}
          APP_HOST: ${{ steps.tfout.outputs.host }}
          APP_LOG_GROUP: ${{ steps.tfout.outputs.app_log_group }}
          SYSTEM_LOG_GROUP: ${{ steps.tfout.outputs.system_log_group }}
          IMAGE_SHA: ${{ github.sha }}
          IMAGE_REPO: ${{ github.repository }}
          SEED_USERNAME: ${{ secrets.SMOKE_USER }}
          SEED_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash scripts/ci/render_hiera.sh puppet/data/deploy.yaml
      - name: Copy Puppet manifests to host
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -r puppet \
            "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}:/tmp/puppet"
      - name: Bootstrap Puppet agent
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}" \
            'sudo bash /tmp/puppet/bootstrap.sh'
      - name: Apply Puppet manifests (masterless, idempotent)
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}" \
            'sudo /opt/puppetlabs/bin/puppet apply /tmp/puppet/manifests/site.pp --modulepath=/tmp/puppet/modules --hiera_config=/tmp/puppet/hiera.yaml --detailed-exitcodes; rc=$?; [ $rc -eq 0 ] || [ $rc -eq 2 ]'
      - name: Scrub rendered secrets from host and runner
        run: bash scripts/ci/scrub_hiera.sh "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}"

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init (read state for outputs)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read app host
        id: tfout
        run: echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Verify /actuator/health (with boot retries)
        run: |
          curl --fail --show-error --silent \
            --retry 20 --retry-delay 15 --retry-all-errors \
            "http://${{ steps.tfout.outputs.host }}/actuator/health"
      - name: Verify /actuator/info
        run: curl --fail --silent --retry 5 --retry-delay 5 "http://${{ steps.tfout.outputs.host }}/actuator/info"
      - name: Verify PostgreSQL connectivity via readiness probe
        run: bash scripts/smoke/db_check.sh "http://${{ steps.tfout.outputs.host }}"
      - name: Verify Swagger UI is served
        run: curl --fail --silent --retry 5 --retry-delay 5 -o /dev/null "http://${{ steps.tfout.outputs.host }}/swagger-ui/index.html"
      - name: Verify OpenAPI document
        run: curl --fail --silent --retry 5 --retry-delay 5 -o /dev/null "http://${{ steps.tfout.outputs.host }}/v3/api-docs"
      - name: Verify nginx is the proxy in front
        run: bash scripts/smoke/nginx_check.sh "http://${{ steps.tfout.outputs.host }}"
      - name: Verify JWT authentication (401 unauth, 200 with token)
        env:
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash scripts/smoke/jwt_check.sh "http://${{ steps.tfout.outputs.host }}"
      - name: Smoke tests (accounts + transfer + history + audit)
        env:
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash scripts/smoke/smoke.sh "http://${{ steps.tfout.outputs.host }}"

  - id: perf_smoke
    kind: perf
    needs: [verify]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init (read state for outputs)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read app host
        id: tfout
        run: echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Install k6
        run: bash scripts/ci/install_k6.sh
      - name: k6 deploy smoke performance check (thresholds enforced)
        env:
          BASE_URL: http://${{ steps.tfout.outputs.host }}
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash scripts/ci/run_gate.sh k6-smoke k6 run --summary-export=k6-smoke-summary.json perf/smoke.js
      - name: Generate HTML performance report
        run: bash scripts/perf/render_report.sh k6-smoke-summary.json k6-smoke-report.html "Deploy smoke performance check"
      - name: Upload k6 smoke report
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-report
          path: |
            k6-smoke-report.html
            k6-smoke-summary.json
          retention-days: 30
      - name: Fail if performance thresholds breached
        run: bash scripts/ci/assert_gate.sh k6-smoke

  - id: release
    kind: custom
    needs: [perf_smoke]
    timeout_minutes: 15
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Build deployment summary
        run: bash scripts/release/deployment_summary.sh reports deployment-summary.md
      - name: Upload deployment summary
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: deployment-summary.md
          retention-days: 90
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/create_release.sh deployment-summary.md reports

