version: 1
name: banking-transaction-service
vcs: github

rollback:
  strategy: manual

stages:
  # ---------------- Build ----------------
  - id: build
    kind: build
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven build (compile + package, tests deferred)
        run: mvn -B -ntp clean package -DskipTests
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # ---------------- Static analysis / formatting ----------------
  - id: format
    kind: lint
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spotless formatting check
        run: mvn -B -ntp spotless:check

  - id: checkstyle
    kind: lint
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Checkstyle (report always produced, verdict recorded)
        run: bash scripts/ci/run_gate.sh checkstyle mvn -B -ntp checkstyle:check
      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          retention-days: 30
      - name: Fail if Checkstyle violations exist
        run: bash scripts/ci/assert_gate.sh checkstyle

  - id: pmd
    kind: lint
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: PMD + CPD (report always produced, verdict recorded)
        run: bash scripts/ci/run_gate.sh pmd mvn -B -ntp pmd:check pmd:cpd-check
      - name: Upload PMD report
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: |
            target/pmd.xml
            target/cpd.xml
          retention-days: 30
      - name: Fail if PMD violations exceed threshold
        run: bash scripts/ci/assert_gate.sh pmd

  - id: spotbugs
    kind: lint
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: SpotBugs (report always produced, verdict recorded)
        run: bash scripts/ci/run_gate.sh spotbugs mvn -B -ntp spotbugs:check
      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 30
      - name: Fail if SpotBugs High priority issues exist
        run: bash scripts/ci/assert_gate.sh spotbugs

  # ---------------- Tests + coverage ----------------
  #
  # Unit and integration tests run in SEPARATE jobs, each producing its own
  # JaCoCo execution file. Neither job enforces the coverage gate: the `coverage`
  # stage below collects both exec files, merges them and gates on the total.
  # Gating on unit data alone would understate real coverage by roughly half —
  # the controllers and the exception handler are exercised by the REST Assured
  # suite against a real Postgres.
  - id: unit_tests
    kind: test
    needs: [build]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: JUnit 5 + Mockito unit tests with JaCoCo
        run: bash scripts/ci/run_gate.sh unit-tests mvn -B -ntp test
      - name: Upload Surefire test report
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/surefire-reports
          retention-days: 30
      - name: Upload unit coverage execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-unit
          path: target/jacoco-ut.exec
          retention-days: 7
      - name: Fail if unit tests failed
        run: bash scripts/ci/assert_gate.sh unit-tests

  # The `test` profile is activated by @ActiveProfiles("test") on
  # AbstractIntegrationTest, NOT by an environment variable here. Failsafe forks
  # a separate JVM and Spring resolves active profiles from the test context's
  # own metadata, so a stage-level SPRING_PROFILES_ACTIVE never reached the
  # context — the first CI run reported `activeProfiles = []`. Run #3 confirmed
  # the fix: the context now reports activeProfiles = ["test"].
  #
  # It still fails to START, for a reason no log window has yet shown. JUnit
  # prints the real error ONCE and then repeats
  #   IllegalStateException: ApplicationContext failure threshold (1) exceeded
  # for each of the remaining 16 tests, so a log tail shows only cascade.
  #
  # first_context_error.sh extracts the ORIGINAL cause from the Failsafe report
  # and writes it to .ci-gates/integration-tests.analysis, which assert_gate.sh
  # prints at BOTH ENDS of the failing step — above and below any raw log
  # window. Three earlier placements each failed to a different truncation:
  # after the assertion (never ran), in its own successful step (`--log-failed`
  # shows only the failing step), and appended to the end of the gate log
  # (landed in the omitted middle).
  - id: integration_tests
    kind: test
    needs: [build]
    timeout_minutes: 30
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spring Boot integration + REST Assured API tests (Testcontainers Postgres)
        run: bash scripts/ci/run_gate.sh integration-tests mvn -B -ntp verify -Pintegration-tests -Djacoco.skip=false
      - name: Print the first context-load failure (root cause, not the cascade)
        run: bash scripts/ci/first_context_error.sh target/failsafe-reports integration-tests
      - name: Upload REST Assured / Failsafe report
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-report
          path: target/failsafe-reports
          retention-days: 30
      - name: Upload integration coverage execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-integration
          path: target/jacoco-it.exec
          retention-days: 7
      - name: Fail if integration or API tests failed
        run: bash scripts/ci/assert_gate.sh integration-tests

  - id: coverage
    kind: test
    needs: [unit_tests, integration_tests]
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Recompile classes for the coverage report
        run: mvn -B -ntp test-compile -DskipTests
      - name: Download unit coverage execution data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec-unit
          path: target
      - name: Download integration coverage execution data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec-integration
          path: target
      - name: Merge unit + integration coverage
        run: mvn -B -ntp jacoco:merge@merge-coverage
      - name: Generate merged JaCoCo report
        run: mvn -B -ntp jacoco:report@merged-report
      - name: Upload merged JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 30
      - name: Enforce coverage gates (line >= 90%, branch >= 85%)
        run: mvn -B -ntp jacoco:check@coverage-gate

  - id: mutation_tests
    kind: test
    needs: [unit_tests]
    timeout_minutes: 40
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: PIT mutation testing (mutation score gate >= 70%)
        run: bash scripts/ci/run_gate.sh pit mvn -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT mutation report
        uses: actions/upload-artifact@v4
        with:
          name: pit-mutation-report
          path: target/pit-reports
          retention-days: 30
      - name: Fail if mutation score below threshold
        run: bash scripts/ci/assert_gate.sh pit

  # ---------------- Security ----------------
  #
  # Dependency CVE scanning uses TRIVY against the BUILT SPRING BOOT JAR, not the
  # source tree. This target is deliberate: `trivy fs` over the repository sees
  # only pom.xml, from which Trivy cannot resolve the transitive dependency
  # graph — it would report almost nothing and look green. The fat JAR contains
  # every resolved dependency under BOOT-INF/lib/ as a concrete versioned
  # artifact, which is the equivalent of what OWASP Dependency-Check analysed.
  #
  # Replaces the former `dependency_check` stage, which could not populate the
  # rate-limited NVD database from a shared GitHub runner IP without an NVD API
  # key. See docs/adr/0004-trivy-replaces-owasp-dependency-check.md.
  #
  # --ignore-unfixed is intentionally NOT set here (unlike the OS-level image
  # scan): an unfixed CVE in the application's own dependency set is a real
  # finding, not unavoidable base-image noise.
  #
  # All three Trivy stages install the tool via scripts/ci/install_trivy.sh. The
  # install block used to be duplicated inline in each stage, pinned to a version
  # that does not exist (v0.58.1), so all three 404'd identically.
  #
  # This stage scans `target/`, which holds the built JAR and no pom.xml, so the
  # Maven-resolution problem described on trivy_fs cannot occur here. Confirmed
  # passing in runs #5 and #6.
  - id: dependency_scan
    kind: security
    needs: [build]
    timeout_minutes: 20
    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/install_trivy.sh
      - name: Trivy dependency scan of the application JAR (CRITICAL/HIGH fail the gate)
        run: bash scripts/ci/run_gate.sh dependency-scan trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --format sarif --output dependency-scan-report.sarif target
      - name: Human-readable dependency findings table
        run: bash scripts/ci/run_gate.sh dependency-scan-table trivy fs --scanners vuln --severity CRITICAL,HIGH --format table --output dependency-scan-report.txt target
      - name: Summarise dependency findings on the failing step
        run: bash scripts/ci/trivy_findings.sh dependency-scan-report.sarif dependency-scan
      - name: Upload dependency scan report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: |
            dependency-scan-report.sarif
            dependency-scan-report.txt
          retention-days: 30
      - name: Fail on High or Critical vulnerable dependencies
        run: bash scripts/ci/assert_gate.sh dependency-scan

  - id: sbom
    kind: security
    needs: [build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate CycloneDX SBOM
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/bom.json
          retention-days: 90

  # `--redact` keeps secret VALUES out of the log, which is correct, but it also
  # reduces the console output to "leaks found: 2" with no file, rule or line.
  # gitleaks_findings.sh reads the SARIF and prints only the LOCATORS (rule id,
  # path, line) to .ci-gates/gitleaks.analysis, which assert_gate.sh prints at
  # both ends of the failing step. Values stay redacted.
  #
  # Three ordering lessons are baked in here. Run #3: the locator step sat AFTER
  # assert_gate.sh, which exits the job, so it never ran. Run #4: it ran but
  # printed only to its own successful step, and `gh run view --log-failed`
  # returns just the failing step. Run #5: it appended to the end of the gate
  # log, which assert_gate.sh windows as head+tail — so it landed in the omitted
  # middle. The dedicated .analysis file, printed unwindowed at both ends, is
  # the structural fix. Confirmed working in run #6, which finally named both
  # findings.
  #
  # .gitleaksignore carries exactly two reviewed, fingerprint-scoped exceptions
  # (an EMPTY placeholder in .env.example, and a deliberately invalid forged
  # token used as a 401 negative-test fixture). Both were read before being
  # allowlisted; neither is a credential. No rule is disabled globally.
  # Gate PASSED in run #6.
  - id: gitleaks
    kind: security
    timeout_minutes: 10
    steps:
      - name: Install gitleaks
        run: |
          GL_VERSION=8.24.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks secret scan
        run: bash scripts/ci/run_gate.sh gitleaks gitleaks detect --source . --redact --report-format sarif --report-path gitleaks-report.sarif --exit-code 1
      - name: Summarise finding locations (values remain redacted)
        run: bash scripts/ci/gitleaks_findings.sh gitleaks-report.sarif gitleaks
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30
      - name: Fail if any secret was detected
        run: bash scripts/ci/assert_gate.sh gitleaks

  # Semgrep runs the SAME three rule packs as before and still BLOCKS the build.
  # What changed is the severity scope: `--error` promoted every finding —
  # including INFO and WARNING — to build-failing, which produced 164 blocking
  # findings from 256 rules across 98 files (60 Terraform rules over 8 files, 65
  # JS rules over 2 k6 scripts). That is rule density, not 164 vulnerabilities.
  #
  # `--severity ERROR` restores Semgrep's own definition of a build-breaking
  # finding: injection, hardcoded secrets, unsafe deserialization, path
  # traversal. INFO/WARNING findings are still scanned, still printed, and still
  # published in the SARIF artifact for review — they simply no longer fail the
  # release. The gate is scoped, not weakened. Confirmed passing in runs #3-#6.
  - id: semgrep
    kind: security
    timeout_minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install --no-cache-dir semgrep
      - name: Semgrep SAST (ERROR severity fails the gate)
        run: bash scripts/ci/run_gate.sh semgrep semgrep scan --config p/java --config p/owasp-top-ten --config p/secrets --severity ERROR --error --sarif --output semgrep-report.sarif .
      - name: Semgrep advisory findings (INFO/WARNING, reported not enforced)
        run: bash scripts/ci/run_gate.sh semgrep-advisory semgrep scan --config p/java --config p/owasp-top-ten --config p/secrets --severity INFO --severity WARNING --sarif --output semgrep-advisory.sarif .
      - name: Upload Semgrep reports
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep-report.sarif
            semgrep-advisory.sarif
          retention-days: 30
      - name: Fail on Semgrep ERROR findings
        run: bash scripts/ci/assert_gate.sh semgrep

  # IaC MISCONFIGURATION GATE — scoped to `infra/` by TARGET, not by flags.
  #
  # HISTORY: this stage failed three times with a Maven Central 429, because
  # `trivy fs .` traversed pom.xml and Trivy's Java analyzer resolved the
  # parent/BOM chain over the network from a shared runner IP. Two flag-based
  # attempts to suppress it (dropping `--scanners vuln`; then
  # `--skip-files pom.xml`) BOTH failed — the analyzer runs during traversal
  # regardless of scanner selection. The fix was to change the scan TARGET:
  # `trivy config infra` is the misconfiguration-only subcommand pointed at a
  # directory with no Maven project, so the analyzer cannot run at all.
  # Confirmed in run #6: the scan completed cleanly (4 config files detected,
  # no network resolution). See ADR 0004 amendment 2.
  #
  # In run #6 the stage then failed for a GENUINE reason — real CRITICAL/HIGH
  # findings in the Terraform — which is the gate working as intended. The
  # substantive fix was in the IaC: SSH (port 22) was open to 0.0.0.0/0 and is
  # now restricted to GitHub's published Actions runner CIDRs. See
  # infra/network.tf. The deliberately public web ports (80/443) are recorded as
  # an accepted risk in .trivyignore with a justification and review date.
  #
  # trivy_findings.sh writes the fired checks to .ci-gates/trivy-fs.analysis so
  # assert_gate.sh prints them on the RED step. Without it the findings sat in a
  # SARIF artifact and a passing step, and identifying them cost several
  # diagnostic round trips — the same lesson already learned for gitleaks and
  # the integration tests.
  #
  # NO GATE IS LOST by the target change — coverage is divided as:
  #   * Java dependency CVEs  -> dependency_scan (built fat JAR, no resolution)
  #   * container/OS CVEs     -> trivy_image
  #   * repo-wide secrets     -> gitleaks (+ semgrep p/secrets)
  #   * Terraform misconfig   -> this stage
  #   * SAST                  -> semgrep
  - id: trivy_fs
    kind: security
    timeout_minutes: 20
    steps:
      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/install_trivy.sh
      - name: Trivy IaC misconfiguration scan of infra/ (CRITICAL/HIGH fail the gate)
        run: bash scripts/ci/run_gate.sh trivy-fs trivy config --severity CRITICAL,HIGH --exit-code 1 --format sarif --output trivy-fs-report.sarif infra
      - name: Human-readable IaC findings table
        run: bash scripts/ci/run_gate.sh trivy-fs-table trivy config --severity CRITICAL,HIGH --format table --output trivy-fs-report.txt infra
      - name: Summarise which checks fired, on the failing step
        run: bash scripts/ci/trivy_findings.sh trivy-fs-report.sarif trivy-fs
      - name: Upload Trivy IaC report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: |
            trivy-fs-report.sarif
            trivy-fs-report.txt
          retention-days: 30
      - name: Fail on Critical or High IaC misconfigurations
        run: bash scripts/ci/assert_gate.sh trivy-fs

  # ---------------- Container ----------------
  - id: docker_build
    kind: build
    needs: [format, checkstyle, pmd, spotbugs, coverage, mutation_tests, dependency_scan, sbom, gitleaks, semgrep, trivy_fs]
    timeout_minutes: 25
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t banking-transaction-service:${{ github.sha }} .
      - name: Save image for scan stage
        run: docker save banking-transaction-service:${{ github.sha }} -o /tmp/image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  - id: trivy_image
    kind: security
    needs: [docker_build]
    timeout_minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/image.tar
      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/install_trivy.sh
      - name: Trivy container scan (CRITICAL/HIGH fail the gate)
        run: bash scripts/ci/run_gate.sh trivy-image trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format sarif --output trivy-image-report.sarif banking-transaction-service:${{ github.sha }}
      - name: Summarise which CVEs fired, on the failing step
        run: bash scripts/ci/trivy_findings.sh trivy-image-report.sarif trivy-image
      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.sarif
          retention-days: 30
      - name: Fail on Critical or High container findings
        run: bash scripts/ci/assert_gate.sh trivy-image

  - id: publish_image
    kind: build_push
    needs: [trivy_image]
    timeout_minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/image.tar
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Tag and push to GHCR
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag banking-transaction-service:${{ github.sha }} ghcr.io/${REPO_LC}:${{ github.sha }}
          docker tag banking-transaction-service:${{ github.sha }} ghcr.io/${REPO_LC}:latest
          docker push ghcr.io/${REPO_LC}:${{ github.sha }}
          docker push ghcr.io/${REPO_LC}:latest

  # ---------------- Infrastructure ----------------
  - id: tf_validate
    kind: lint
    timeout_minutes: 10
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Terraform init (no backend, validation only)
        run: terraform init -input=false -backend=false
        working-directory: infra
      - name: Terraform validate
        run: terraform validate
        working-directory: infra

  - id: provision
    kind: provision
    needs: [publish_image, tf_validate]
    timeout_minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
        working-directory: infra
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: infra

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init (read state for outputs)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read infrastructure outputs
        id: tfout
        run: |
          echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
          echo "db_host=$(terraform output -raw db_address)" >> "$GITHUB_OUTPUT"
          echo "app_log_group=$(terraform output -raw app_log_group)" >> "$GITHUB_OUTPUT"
          echo "system_log_group=$(terraform output -raw system_log_group)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ steps.tfout.outputs.host }}" >> ~/.ssh/known_hosts
      - name: Wait for SSH availability
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 \
              "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}" true 2>/dev/null; then
              echo "SSH ready"; exit 0
            fi
            echo "waiting for sshd ($i/30)"; sleep 10
          done
          echo "SSH never became available"; exit 1
      - name: Render Hiera data from infrastructure outputs
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DB_HOST: ${{ steps.tfout.outputs.db_host }}
          APP_HOST: ${{ steps.tfout.outputs.host }}
          APP_LOG_GROUP: ${{ steps.tfout.outputs.app_log_group }}
          SYSTEM_LOG_GROUP: ${{ steps.tfout.outputs.system_log_group }}
          IMAGE_SHA: ${{ github.sha }}
          IMAGE_REPO: ${{ github.repository }}
          SEED_USERNAME: ${{ secrets.SMOKE_USER }}
          SEED_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash scripts/ci/render_hiera.sh puppet/data/deploy.yaml
      - name: Copy Puppet manifests to host
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -r puppet \
            "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}:/tmp/puppet"
      - name: Bootstrap Puppet agent
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}" \
            'sudo bash /tmp/puppet/bootstrap.sh'
      - name: Apply Puppet manifests (masterless, idempotent)
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}" \
            'sudo /opt/puppetlabs/bin/puppet apply /tmp/puppet/manifests/site.pp --modulepath=/tmp/puppet/modules --hiera_config=/tmp/puppet/hiera.yaml --detailed-exitcodes; rc=$?; [ $rc -eq 0 ] || [ $rc -eq 2 ]'
      - name: Scrub rendered secrets from host and runner
        run: bash scripts/ci/scrub_hiera.sh "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host }}"

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init (read state for outputs)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read application host
        id: tfout
        run: echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Health check with retry/backoff
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 15 --retry-all-errors \
            "http://${{ steps.tfout.outputs.host }}/actuator/health"
      - name: Verify readiness probe reports UP
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 10 --retry-all-errors \
            "http://${{ steps.tfout.outputs.host }}/actuator/health/readiness"
      - name: Verify the landing page is served
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 10 --retry-all-errors \
            --output /dev/null "http://${{ steps.tfout.outputs.host }}/"

  - id: perf_smoke
    kind: perf
    needs: [verify]
    timeout_minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init (read state for outputs)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read application host
        id: tfout
        run: echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: k6 smoke test (p95 latency and error-rate thresholds)
        env:
          BASE_URL: http://${{ steps.tfout.outputs.host }}
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: k6 run perf/smoke.js

  - id: release
    kind: notify
    needs: [perf_smoke]
    timeout_minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init (read state for outputs)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read application host
        id: tfout
        run: echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Write release summary
        env:
          APP_HOST: ${{ steps.tfout.outputs.host }}
          IMAGE_SHA: ${{ github.sha }}
        run: bash scripts/ci/release_summary.sh

