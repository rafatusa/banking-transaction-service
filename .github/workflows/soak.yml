name: soak
'on':
  workflow_dispatch: {}
jobs:
  soak_test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init (read state for outputs)
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tfout
      name: Read app host
      run: echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Install k6
      run: bash scripts/ci/install_k6.sh
    - name: k6 full soak (200 VUs, 15 min, thresholds reported not enforced)
      run: bash scripts/ci/run_gate.sh k6-soak k6 run --summary-export=k6-soak-summary.json
        perf/soak.js
      env:
        BASE_URL: http://${{ steps.tfout.outputs.host }}
        SMOKE_USER: ${{ secrets.SMOKE_USER }}
        SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    - name: Generate HTML performance report
      run: bash scripts/perf/render_report.sh k6-soak-summary.json k6-soak-report.html
        "200 VU / 15 min soak"
    - name: Upload k6 soak report
      uses: actions/upload-artifact@v4
      with:
        name: k6-soak-report
        path: 'k6-soak-report.html

          k6-soak-summary.json

          '
        retention-days: 90
