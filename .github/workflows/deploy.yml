      working-directory: infra
    - name: Terraform plan
      run: terraform plan -input=false -out=tfplan
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -input=false -auto-approve tfplan
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init (read state for outputs)
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tfout
      name: Read infrastructure outputs
      run: 'echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"

        echo "db_host=$(terraform output -raw db_address)" >> "$GITHUB_OUTPUT"

        echo "app_log_group=$(terraform output -raw app_log_group)" >> "$GITHUB_OUTPUT"

        echo "system_log_group=$(terraform output -raw system_log_group)" >> "$GITHUB_OUTPUT"

        '
      working-directory: infra
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ steps.tfout.outputs.host }}" >> ~/.ssh/known_hosts

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Wait for SSH availability
      run: "for i in $(seq 1 30); do\n  if ssh -i ~/.ssh/deploy_key -o BatchMode=yes\
        \ -o ConnectTimeout=10 \\\n    \"${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host\
        \ }}\" true 2>/dev/null; then\n    echo \"SSH ready\"; exit 0\n  fi\n  echo\
        \ \"waiting for sshd ($i/30)\"; sleep 10\ndone\necho \"SSH never became available\"\
        ; exit 1\n"
    - name: Render Hiera data from infrastructure outputs
      run: bash scripts/ci/render_hiera.sh puppet/data/deploy.yaml
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GHCR_ACTOR: ${{ github.actor }}
        DB_HOST: ${{ steps.tfout.outputs.db_host }}
        APP_HOST: ${{ steps.tfout.outputs.host }}
        APP_LOG_GROUP: ${{ steps.tfout.outputs.app_log_group }}
        SYSTEM_LOG_GROUP: ${{ steps.tfout.outputs.system_log_group }}
        IMAGE_SHA: ${{ github.sha }}
        IMAGE_REPO: ${{ github.repository }}
        SEED_USERNAME: ${{ secrets.SMOKE_USER }}
        SEED_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    - name: Copy Puppet manifests to host
      run: "scp -i ~/.ssh/deploy_key -o BatchMode=yes -r puppet \\\n  \"${{ secrets.SSH_USER\
        \ }}@${{ steps.tfout.outputs.host }}:/tmp/puppet\"\n"
    - name: Bootstrap Puppet agent
      run: "ssh -i ~/.ssh/deploy_key -o BatchMode=yes \\\n  \"${{ secrets.SSH_USER\
        \ }}@${{ steps.tfout.outputs.host }}\" \\\n  'sudo bash /tmp/puppet/bootstrap.sh'\n"
    - name: Apply Puppet manifests (masterless, idempotent)
      run: "ssh -i ~/.ssh/deploy_key -o BatchMode=yes \\\n  \"${{ secrets.SSH_USER\
        \ }}@${{ steps.tfout.outputs.host }}\" \\\n  'sudo /opt/puppetlabs/bin/puppet\
        \ apply /tmp/puppet/manifests/site.pp --modulepath=/tmp/puppet/modules --hiera_config=/tmp/puppet/hiera.yaml\
        \ --detailed-exitcodes; rc=$?; [ $rc -eq 0 ] || [ $rc -eq 2 ]'\n"
    - name: Scrub rendered secrets from host and runner
      run: bash scripts/ci/scrub_hiera.sh "${{ secrets.SSH_USER }}@${{ steps.tfout.outputs.host
        }}"
  verify:
    runs-on: ubuntu-latest
    needs:
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
