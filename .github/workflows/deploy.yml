    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Install gitleaks
      run: "GL_VERSION=8.24.0\ncurl -sSfL -o /tmp/gitleaks.tar.gz \\\n  \"https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz\"\
        \ntar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks\nsudo install -m 0755 /tmp/gitleaks\
