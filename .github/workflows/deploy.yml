    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init (read state for outputs)
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tfout
      name: Read application host
      run: echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Health check with retry/backoff
      run: "curl --fail --silent --show-error \\\n  --retry 20 --retry-delay 15 --retry-all-errors\
        \ \\\n  \"http://${{ steps.tfout.outputs.host }}/actuator/health\"\n"
    - name: Verify readiness probe reports UP
      run: "curl --fail --silent --show-error \\\n  --retry 10 --retry-delay 10 --retry-all-errors\
        \ \\\n  \"http://${{ steps.tfout.outputs.host }}/actuator/health/readiness\"\
        \n"
    - name: Verify the landing page is served
      run: "curl --fail --silent --show-error \\\n  --retry 10 --retry-delay 10 --retry-all-errors\
        \ \\\n  --output /dev/null \"http://${{ steps.tfout.outputs.host }}/\"\n"
  perf_smoke:
    runs-on: ubuntu-latest
    needs:
    - verify
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init (read state for outputs)
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tfout
      name: Read application host
      run: echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Install k6
      run: "sudo gpg -k\nsudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg\
        \ \\\n  --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69\n\
        echo \"deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb\
        \ stable main\" \\\n  | sudo tee /etc/apt/sources.list.d/k6.list\nsudo apt-get\
        \ update\nsudo apt-get install -y k6\n"
    - name: k6 smoke test (p95 latency and error-rate thresholds)
      run: k6 run perf/smoke.js
      env:
        BASE_URL: http://${{ steps.tfout.outputs.host }}
        SMOKE_USER: ${{ secrets.SMOKE_USER }}
        SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
  release:
    runs-on: ubuntu-latest
    needs:
    - perf_smoke
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_instance_type: t3.small
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init (read state for outputs)
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tfout
      name: Read application host
      run: echo "host=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Write release summary
      run: bash scripts/ci/release_summary.sh
      env:
        APP_HOST: ${{ steps.tfout.outputs.host }}
        IMAGE_SHA: ${{ github.sha }}
