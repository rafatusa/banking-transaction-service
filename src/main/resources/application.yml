spring:
  application:
    name: banking-transaction-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banking}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: banking-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate validates it and never mutates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # nginx terminates the public connection and proxies to this app.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # health/info are public; prometheus is ADMIN-only via SecurityConfig and is
        # not proxied publicly by nginx.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Shows the database component so the deploy verify stage can prove DB connectivity.
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: banking-transaction-service

info:
  app:
    name: banking-transaction-service
    description: Enterprise Banking Transaction Service
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  jwt:
    # No default: the app must fail fast at startup if JWT_SECRET was not supplied.
    secret: ${JWT_SECRET}
    validity-minutes: ${JWT_VALIDITY_MINUTES:60}
    issuer: banking-transaction-service

logging:
  level:
    root: INFO
    com.example.bankingtransactionservice: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
